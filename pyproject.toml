[project]
name = "police-agent"
version = "1.00"
description = "Police agent for the distributed Police-vs-Thief P2P game (FastMCP, Dec-POMDP, commit-reveal)"
readme = "README.md"
authors = [
    { name = "moaawiyahhaj", email = "moaawiyah.haj@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.5",
    "pillow>=11.0",
]

# Needed only to actually send the end-of-game report over the Gmail API. Kept
# out of the base install so a default run -- reporting off, or writing a local
# .eml draft -- needs no Google account and touches no network.
[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]
research = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
]

[project.scripts]
police-agent = "police_agent:main"

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `research/` is a top-level package, not part of the shipped `src/` wheel, so
# it is not installed into the venv. Putting the repo root on the path is what
# lets tests import it regardless of the working directory pytest was run from.
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: talks over real sockets; deselect with -m 'not slow'",
]

[tool.coverage.run]
# `research/` is measured alongside `src/`: it is real, tested code that the
# report's conclusions rest on, so exempting it would be exempting the evidence.
source = ["src", "research"]
# Only the four modules that construct Tk widgets, which cannot be exercised by
# a headless test process. The rest of gui/ is deliberately Tk-free (see
# gui/game_mode.py and gui/live_events.py, which say so) and is measured like
# any other source file. __main__.py and the two MCP modules were omitted
# historically and no longer are -- they are covered, and omitting covered code
# only understates what the suite actually reaches.
omit = [
    "*/gui/board_view.py",
    "*/gui/live_controls.py",
    "*/gui/replay_controls.py",
    "*/gui/window.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
