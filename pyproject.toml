[project]
name = "police-agent"
version = "0.1.0"
description = "Police agent for the distributed Police-vs-Thief P2P game (FastMCP, Dec-POMDP, commit-reveal)"
readme = "README.md"
authors = [
    { name = "moaawiyahhaj", email = "moaawiyah.haj@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.5",
]

# Needed only to actually send the end-of-game report over the Gmail API. Kept
# out of the base install so a default run -- reporting off, or writing a local
# .eml draft -- needs no Google account and touches no network.
[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
police-agent = "police_agent:main"

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: talks over real sockets; deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__main__.py",
    "*/gui/*",
    "*/infra/mcp_server.py",
    "*/infra/mcp_client.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
